<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 14px;
      color: #333;
    }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      background: #4A90D9;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #357ABD;
    }
    button.active {
      background: #E74C3C;
    }
    .hint {
      margin-top: 10px;
      font-size: 11px;
      color: #888;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h3>SVG Downloader</h3>
  <button id="toggle">Start SVG Selection Mode</button>
  <p class="hint">Click the button, then click any SVG on the page to download it. Press <b>Esc</b> to exit.</p>
  <script src="popup.js"></script>
</body>
</html>
